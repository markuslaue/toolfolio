# Toolfolio - Deployment auf VPS B hinter dem vorhandenen Traefik.
# Traefik laeuft im host-Netz mit Docker-Provider (exposedbydefault=false),
# Certresolver "letsencrypt".
#
# DAS IMAGE WIRD NICHT MEHR HIER GEBAUT.
#
# Der VPS hat 4 GB RAM. Ein Next.js-Build braucht davon fast alles, und solange er
# laeuft, ist der Server so beschaeftigt, dass er keine Anfrage mehr beantwortet: die
# Seite war bei JEDEM Deploy minutenlang nicht erreichbar, obwohl der Container lief.
# Load 44 statt 2, 59 MB freier Speicher.
#
# Jetzt baut GitHub Actions das Image und legt es in die GitHub-Registry. Der Server
# macht nur noch "pull" und "up": Sekunden statt Minuten, ohne Last, ohne Ausfall.
#
# Deploy:  bash scripts/deploy.sh
#
# Laufzeit-Secrets kommen aus /opt/toolfolio/.env auf dem Server (NICHT committen).

services:
  web:
    image: ${TOOLFOLIO_IMAGE:-ghcr.io/markuslaue/toolfolio:latest}
    container_name: toolfolio-web
    restart: unless-stopped
    # .env liefert sowohl die Build-Args (NEXT_PUBLIC_*) per Compose-Interpolation
    # als auch die Laufzeit-Variablen (inkl. SUPABASE_SERVICE_ROLE_KEY) in den Container.
    env_file: .env
    expose:
      - "3000"
    # Host-lokaler Port, damit der vorgelagerte nginx (Front-Proxy auf diesem VPS)
    # die App erreichen kann. Nur an 127.0.0.1 gebunden, nicht oeffentlich.
    ports:
      - "127.0.0.1:8090:3000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.toolfolio.rule=Host(`toolfolio.de`) || Host(`www.toolfolio.de`)"
      - "traefik.http.routers.toolfolio.entrypoints=websecure"
      - "traefik.http.routers.toolfolio.tls.certresolver=letsencrypt"
      - "traefik.http.services.toolfolio.loadbalancer.server.port=3000"
      - "traefik.docker.network=toolfolio_default"
      # www -> apex Redirect
      - "traefik.http.routers.toolfolio.middlewares=toolfolio-www@docker"
      - "traefik.http.middlewares.toolfolio-www.redirectregex.regex=^https://www\\.toolfolio\\.de/(.*)"
      - "traefik.http.middlewares.toolfolio-www.redirectregex.replacement=https://toolfolio.de/$${1}"
      - "traefik.http.middlewares.toolfolio-www.redirectregex.permanent=true"

networks:
  default:
    name: toolfolio_default
