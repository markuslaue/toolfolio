# Baut das Produktions-Image bei GitHub und schiebt es in die GitHub-Registry.
#
# WARUM: Der VPS hat 4 GB RAM. Ein Next.js-Build braucht davon fast alles, und solange
# er laeuft, ist der Server so beschaeftigt, dass er keine Anfrage mehr beantwortet.
# Die Seite war damit bei JEDEM Deploy minutenlang nicht erreichbar, obwohl der
# Webcontainer die ganze Zeit lief. Load 44 statt 2, 59 MB freier Speicher.
#
# Jetzt baut GitHub (kostenlos, auf fremder Hardware), und der Server macht nur noch
# "pull" und "up": Sekunden statt Minuten, ohne Last, ohne Ausfall.
#
# Deployen soll langweilig sein.

name: Image bauen und veroeffentlichen

# Der Produktionscode liegt auf dem Branch "production", NICHT auf main:
# main gehoert dem Lovable-Prototyp (eigene, getrennte Historie). Deshalb baut dieser
# Workflow von "production".
on:
  push:
    branches: [production]
  workflow_dispatch: # von Hand ausloesbar

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository_owner }}/toolfolio

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: An der Registry anmelden
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Bauen und hochladen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          # NEXT_PUBLIC_* werden beim Build in den Code eingebacken und muessen deshalb
          # HIER vorliegen, nicht erst zur Laufzeit. Sie sind oeffentlich (der Anon-Key
          # ist per Definition oeffentlich, die RLS schuetzt die Daten, nicht der Key).
          # Die echten Geheimnisse (Service-Role, Stripe, Anthropic) bleiben auf dem
          # Server und kommen NIE ins Image.
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_SITE_URL=${{ secrets.NEXT_PUBLIC_SITE_URL }}
          # Zwischenspeicher, damit der zweite Build Minuten spart.
          cache-from: type=gha
          cache-to: type=gha,mode=max
